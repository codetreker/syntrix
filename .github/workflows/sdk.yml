name: SDK CI

on:
  pull_request:
    paths:
      - 'packages/sdks/client-ts/**'
      - 'packages/examples/realtime-demo/**'
      - '.github/workflows/sdk.yml'
      - '.github/workflows/scripts/sdk_test_and_coverage.sh'

jobs:
  sdk:
    name: SDK (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./packages/sdks/client-ts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: bun run build

      - name: Test with Coverage
        run: ../../../.github/workflows/scripts/sdk_test_and_coverage.sh

      - name: Verify isolated package consumer
        run: bun run test:package

      - name: Build replica demo
        working-directory: ./packages/examples/realtime-demo
        run: |
          bun install --frozen-lockfile --force
          bun run build
