apiVersion: v1
kind: Namespace
metadata:
  name: syntrix-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-client
  namespace: syntrix-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: console-client
  template:
    metadata:
      labels:
        app: console-client
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console-client
          image: console-client:development
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: CONSOLE_API_ORIGIN
              value: http://console-server:8090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /health/live
              port: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: nginx-config
          emptyDir: {}
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: console-client
  namespace: syntrix-platform
spec:
  selector:
    app: console-client
  ports:
    - port: 8080
      targetPort: 8080
