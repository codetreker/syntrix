server:
  address: "127.0.0.1:8090"
  public_origin: "http://localhost:8090"

database:
  dsn: "postgres://syntrix:syntrix@localhost:5432/console?sslmode=disable"

auth:
  session_ttl: 24h
  developers:
    - id: "development"
      username: "developer"
      password: "ChangeThisDevelopmentPassword!"

provisioning:
  mode: "in_cluster"
  namespace: "syntrix-tests"
  installation_id: "console-development"

workload:
  reconcile_interval: 2s
  operation_timeout: 20s
  templates:
    - id: "http-test"
      image: "nginxinc/nginx-unprivileged:1.27.5-alpine"
      port: 8080
      env: {}
      cpu_request: "25m"
      cpu_limit: "100m"
      memory_request: "32Mi"
      memory_limit: "64Mi"
      probe_path: "/"
