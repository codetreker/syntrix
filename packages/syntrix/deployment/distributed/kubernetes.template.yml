{{ requireMode "distributed" }}
apiVersion: v1
kind: Namespace
metadata:
  name:
{{- printf " %s" (quote .Namespace) }}
---
apiVersion: v1
kind: Secret
metadata:
  name:
{{- printf " %s" (quote .CredentialsName) }}
  namespace:
{{- printf " %s" (quote .Namespace) }}
type: Opaque
stringData:
  config.local.yml:
{{- printf " %s" (quote (credentials)) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name:
{{- printf " %s" (quote .PullerPVCName) }}
  namespace:
{{- printf " %s" (quote $.Namespace) }}
spec:
  accessModes: [ReadWriteOnce]
{{- if $.StorageClass }}
  storageClassName:
{{- printf " %s" (quote $.StorageClass) }}
{{- end }}
  resources:
    requests:
      storage:
{{- printf " %vGi" ($.StorageGiB) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name:
{{- printf " %s" (quote .IndexerPVCName) }}
  namespace:
{{- printf " %s" (quote $.Namespace) }}
spec:
  accessModes: [ReadWriteOnce]
{{- if $.StorageClass }}
  storageClassName:
{{- printf " %s" (quote $.StorageClass) }}
{{- end }}
  resources:
    requests:
      storage:
{{- printf " %vGi" ($.StorageGiB) }}
{{ range .Workloads }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name:
{{- printf " %s" (quote .ConfigName) }}
  namespace:
{{- printf " %s" (quote $.Namespace) }}
data:
  config.yml:
{{- printf " %s" (quote (runtimeConfig .Role)) }}
  rules.yml: |
    database: default
    rules_version: '1'
    service: syntrix
    match:
      /databases/{database}/documents:
        match:
          /{document=**}:
            allow:
              read, write: "request.auth != null && ('admin' in request.auth.roles || 'system' in request.auth.roles)"
  templates.yml: |
    database: default
    templates:
      - name: deployment-checks-by-created
        collectionPattern: deployment_checks
        fields:
          - field: createdAt
            order: desc
  triggers.keep: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name:
{{- printf " %s" (quote .Name) }}
  namespace:
{{- printf " %s" (quote $.Namespace) }}
  labels:
    app.kubernetes.io/instance:
{{- printf " %s" (quote $.NamePrefix) }}
    app.kubernetes.io/name:
{{- printf " %s" (quote .Name) }}
spec:
  replicas:
{{- printf " %v" (.Replicas) }}
  progressDeadlineSeconds: 1980
  strategy:
{{- if or .Stateful (eq .Role "trigger_evaluator") }}
    type: Recreate
{{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
{{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance:
{{- printf " %s" (quote $.NamePrefix) }}
      app.kubernetes.io/name:
{{- printf " %s" (quote .Name) }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance:
{{- printf " %s" (quote $.NamePrefix) }}
        app.kubernetes.io/name:
{{- printf " %s" (quote .Name) }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: syntrix
          image:
{{- printf " %s" (quote $.Image) }}
          imagePullPolicy: IfNotPresent
          args:
{{- printf " [%s, \"--config-dir\", \"/etc/syntrix\"]" (quote .Flag) }}
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu:
{{- printf " %s" (quote .Resources.Requests.CPU) }}
              memory:
{{- printf " %s" (quote .Resources.Requests.Memory) }}
            limits:
              cpu:
{{- printf " %s" (quote .Resources.Limits.CPU) }}
              memory:
{{- printf " %s" (quote .Resources.Limits.Memory) }}
          startupProbe:
{{- if or (eq .Role "standalone") (eq .Role "api") }}
            httpGet:
              path: /health
              port: http
{{- else }}
            tcpSocket:
              port: grpc
{{- end }}
            periodSeconds: 5
            failureThreshold: 372
          readinessProbe:
{{- if or (eq .Role "standalone") (eq .Role "api") }}
            httpGet:
              path: /health
              port: http
{{- else }}
            tcpSocket:
              port: grpc
{{- end }}
          livenessProbe:
{{- if or (eq .Role "standalone") (eq .Role "api") }}
            httpGet:
              path: /health
              port: http
{{- else }}
            tcpSocket:
              port: grpc
{{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/syntrix
              readOnly: true
            - name: data
              mountPath: /data
{{- if .Stateful }}
            - name: persistent
{{- if eq .Role "puller" }}
              mountPath: "/data/puller"
{{- else }}
              mountPath: "/data/indexer"
{{- end }}
{{- end }}
            - name: temporary
              mountPath: /tmp
{{- if .HasKey }}
            - name: signing-key
              mountPath: /etc/syntrix/keys
              readOnly: true
{{- end }}
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name:
{{- printf " %s" (quote .ConfigName) }}
                  items:
                    - key: config.yml
                      path: config.yml
                    - key: rules.yml
                      path: security_rules/default.yml
                    - key: templates.yml
                      path: index_templates/default.yml
                    - key: triggers.keep
                      path: triggers/.keep
              - secret:
                  name:
{{- printf " %s" (quote $.CredentialsName) }}
                  items:
                    - key: config.local.yml
                      path: config.local.yml
        - name: data
          emptyDir: {}
{{- if .Stateful }}
        - name: persistent
          persistentVolumeClaim:
            claimName:
{{- printf " %s" (quote .PVCName) }}
{{- end }}
        - name: temporary
          emptyDir: {}
{{- if .HasKey }}
        - name: signing-key
          secret:
            secretName:
{{- printf " %s" (quote $.SigningKeySecret) }}
            defaultMode: 0440
            items:
              - key: auth_private.pem
                path: auth_private.pem
{{ end }}
{{ if or (eq .Role "standalone") (eq .Role "api") (eq .Role "query") (eq .Role "indexer") (eq .Role "puller") (eq .Role "streamer") -}}
---
apiVersion: v1
kind: Service
metadata:
  name:
{{- printf " %s" (quote .Name) }}
  namespace:
{{- printf " %s" (quote $.Namespace) }}
spec:
  selector:
    app.kubernetes.io/instance:
{{- printf " %s" (quote $.NamePrefix) }}
    app.kubernetes.io/name:
{{- printf " %s" (quote .Name) }}
  ports:
{{- if or (eq .Role "standalone") (eq .Role "api") }}
    - name: http
      port: 8080
      targetPort: http
{{- else }}
    - name: grpc
      port: 9000
      targetPort: grpc
{{ end }}
{{- end }}
{{ end }}
{{ if .Bootstrap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name:
{{- printf " %s" (quote .BootstrapConfigName) }}
  namespace:
{{- printf " %s" (quote $.Namespace) }}
data:
  config.yml:
{{- printf " %s" (quote (runtimeConfig "bootstrap")) }}
  rules.yml: |
    database: default
    rules_version: '1'
    service: syntrix
    match:
      /databases/{database}/documents:
        match:
          /{document=**}:
            allow:
              read, write: "request.auth != null && ('admin' in request.auth.roles || 'system' in request.auth.roles)"
  templates.yml: |
    database: default
    templates:
      - name: deployment-checks-by-created
        collectionPattern: deployment_checks
        fields:
          - field: createdAt
            order: desc
  triggers.keep: ""
---
apiVersion: v1
kind: Pod
metadata:
  name:
{{- printf " %s" (quote .BootstrapName) }}
  namespace:
{{- printf " %s" (quote .Namespace) }}
  labels:
    app.kubernetes.io/instance:
{{- printf " %s" (quote .NamePrefix) }}
    app.kubernetes.io/name:
{{- printf " %s" (quote .BootstrapName) }}
spec:
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  restartPolicy: Never
  containers:
    - name: syntrix
      image:
{{- printf " %s" (quote .Image) }}
      imagePullPolicy: IfNotPresent
      args: ["--standalone", "--config-dir", "/etc/syntrix", "--bootstrap-indexes", "--writes-quiesced", "--bootstrap-timeout=30m"]
      ports:
        - name: http
          containerPort: 8080
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu:
{{- printf " %s" (quote .BootstrapResources.Requests.CPU) }}
          memory:
{{- printf " %s" (quote .BootstrapResources.Requests.Memory) }}
        limits:
          cpu:
{{- printf " %s" (quote .BootstrapResources.Limits.CPU) }}
          memory:
{{- printf " %s" (quote .BootstrapResources.Limits.Memory) }}
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 5
        failureThreshold: 372
      readinessProbe:
        httpGet:
          path: /health
          port: http
      volumeMounts:
        - name: config
          mountPath: /etc/syntrix
          readOnly: true
        - name: data
          mountPath: /data
        - name: puller
          mountPath: /data/puller
        - name: indexer
          mountPath: /data/indexer
        - name: temporary
          mountPath: /tmp
{{- if .SigningKeySecret }}
        - name: signing-key
          mountPath: /etc/syntrix/keys
          readOnly: true
{{- end }}
  volumes:
    - name: config
      projected:
        sources:
          - configMap:
              name:
{{- printf " %s" (quote .BootstrapConfigName) }}
              items:
                - key: config.yml
                  path: config.yml
                - key: rules.yml
                  path: security_rules/default.yml
                - key: templates.yml
                  path: index_templates/default.yml
                - key: triggers.keep
                  path: triggers/.keep
          - secret:
              name:
{{- printf " %s" (quote $.CredentialsName) }}
              items:
                - key: config.local.yml
                  path: config.local.yml
    - name: data
      emptyDir: {}
    - name: puller
      persistentVolumeClaim:
        claimName:
{{- printf " %s" (quote .PullerPVCName) }}
    - name: indexer
      persistentVolumeClaim:
        claimName:
{{- printf " %s" (quote .IndexerPVCName) }}
    - name: temporary
      emptyDir: {}
{{- if .SigningKeySecret }}
    - name: signing-key
      secret:
        secretName:
{{- printf " %s" (quote $.SigningKeySecret) }}
        defaultMode: 0440
        items:
          - key: auth_private.pem
            path: auth_private.pem
{{ end }}
{{ end }}
